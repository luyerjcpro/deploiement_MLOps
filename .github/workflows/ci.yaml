name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest

    services:
      db_postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projet5_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Le nom de la base se termine par _test : le conftest.py l'accepte tel
      # quel et ne risque donc pas de viser une base applicative.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/projet5_test

      # api/main.py refuse de démarrer sans cette variable. En CI on utilise
      # le secret du dépôt s'il existe, sinon une valeur de test : la clé ne
      # protège ici qu'une base jetable, elle n'a pas à être la vraie.
      SECRET_API_KEY: ${{ secrets.SECRET_API_KEY || 'cle-de-test-ci' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - run: uv run pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Garde-fou : tant que le Dockerfile n'est pas versionné, ce job
      # échouerait sans message clair. À retirer une fois le Dockerfile ajouté.
      - name: Vérifier la présence du Dockerfile
        run: test -f Dockerfile || { echo "::error::Dockerfile absent du dépôt"; exit 1; }

      - run: docker build -t attrition-api:test .